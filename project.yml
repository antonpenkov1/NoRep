name: NoRep
options:
  bundleIdPrefix: com.norep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
schemes:
  NoRep:
    build:
      targets:
        NoRep: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  NoRep:
    type: application
    platform: iOS
    sources:
      - path: NoRep
    dependencies:
      - target: NoRepWidgets
    entitlements:
      path: NoRep/NoRep.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: NoRep/Info.plist
      properties:
        CFBundleDisplayName: NoRep
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSHealthUpdateUsageDescription: "NoRep saves your finished workouts to Apple Health so they count toward your activity rings."
        NSHealthShareUsageDescription: "NoRep only writes workouts to Apple Health and never reads your health data."
        CFBundleLocalizations: [en, ru, sr, es, de, fr, pt-BR]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norep.app
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blaze AppIcon-Chalk AppIcon-Blackout AppIcon-Gold"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3UHRLQ9522
  NoRepWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NoRepWidgets
      - path: NoRep/Common/LiveActivity/WorkoutActivityAttributes.swift
    info:
      path: NoRepWidgets/Info.plist
      properties:
        CFBundleDisplayName: NoRep Timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norep.app.widgets
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3UHRLQ9522
