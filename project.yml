name: NoRep
options:
  bundleIdPrefix: com.norep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  NoRep:
    type: application
    platform: iOS
    sources:
      - path: NoRep
    dependencies:
      - target: NoRepWidgets
    info:
      path: NoRep/Info.plist
      properties:
        CFBundleDisplayName: NoRep
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norep.app
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blaze AppIcon-Chalk AppIcon-Blackout AppIcon-Gold"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3UHRLQ9522
  NoRepWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NoRepWidgets
      - path: NoRep/Common/LiveActivity/WorkoutActivityAttributes.swift
    info:
      path: NoRepWidgets/Info.plist
      properties:
        CFBundleDisplayName: NoRep Timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norep.app.widgets
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3UHRLQ9522
